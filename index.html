
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabji Hub - Fresh Vegetables</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f8f2;
      color: #222;
    }
    header {
      background: #16833b;
      color: white;
      text-align: center;
      padding: 22px 12px;
    }
    header h1 { margin: 0; font-size: 28px; }
    header p { margin: 7px 0 0; }
    main { max-width: 850px; margin: auto; padding: 15px; }
    .section {
      background: white;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px #00000010;
    }
    h2 { color: #16833b; margin-top: 0; }
    #products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 12px;
    }
    .product {
      background: white;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 2px 8px #00000012;
    }
    .product h3 { margin: 0 0 9px; font-size: 18px; }
    .price { color: #16833b; font-size: 18px; font-weight: bold; }
    .stock { color: #666; font-size: 13px; margin-top: 7px; }
    .unavailable { color: #c0392b; }
    .quantity {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }
    button {
      border: 0;
      background: #16833b;
      color: white;
      padding: 9px 13px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
    }
    button:disabled { background: #aaa; }
    .quantity span { font-weight: bold; min-width: 18px; text-align: center; }
    .cart-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }
    .total-row {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
    }
    .grand-total {
      font-size: 20px;
      font-weight: bold;
      color: #16833b;
      border-top: 1px solid #ddd;
      padding-top: 12px;
    }
    .empty { color: #777; }
    .bottom { text-align: center; color: #666; padding: 20px; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>🥬 Sabji Hub</h1>
    <p>Taazi Sabzi, Aapke Ghar Tak!</p>
  </header>

  <main>
    <section class="section">
      <h2>Aaj ki sabziyan</h2>
      <div id="status">Sabziyon ki list load ho rahi hai...</div>
      <button id="refresh">Refresh</button>
    </section>

    <section id="products"></section>

    <section class="section">
      <h2>🛒 Aapka Cart</h2>
      <div id="cartItems" class="empty">Abhi cart khaali hai.</div>
      <div class="total-row">
        <span>Sabziyon ka total</span>
        <strong id="subtotal">₹0</strong>
      </div>
      <div class="total-row">
        <span>Delivery charge</span>
        <strong id="delivery">₹0</strong>
      </div>
      <div class="total-row grand-total">
        <span>Grand Total</span>
        <span id="grandTotal">₹0</span>
      </div>
      <p class="stock">₹100 tak ke order par ₹20 delivery. ₹100 se zyada par free delivery.</p>
    </section>
  </main>

  <div class="bottom">Sabji Hub · Ahmedabad</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      getDocs
    } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAqF827n4_hn-b4-4pOLxgKqK39l7OMTt84",
      authDomain: "sabji-hub.firebaseapp.com",
      projectId: "sabji-hub",
      storageBucket: "sabji-hub.firebasestorage.app",
      messagingSenderId: "241093629232",
      appId: "1:241093629232:web:c3a4defd6d01ab201024f5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const productsBox = document.getElementById("products");
    const statusBox = document.getElementById("status");
    const cartItemsBox = document.getElementById("cartItems");

    const vegetables = [];
    const cart = {};

    function updateCart() {
      cartItemsBox.replaceChildren();
      let subtotal = 0;
      let count = 0;

      vegetables.forEach((veg) => {
        const quantity = cart[veg.id] || 0;
        if (quantity <= 0) return;

        const amount = quantity * veg.price;
        subtotal += amount;
        count++;

        const row = document.createElement("div");
        row.className = "cart-row";

        const name = document.createElement("span");
        name.textContent = veg.name + " × " + quantity + " " + veg.unit;

        const price = document.createElement("strong");
        price.textContent = "₹" + amount;

        row.append(name, price);
        cartItemsBox.appendChild(row);
      });

      if (count === 0) {
        cartItemsBox.textContent = "Abhi cart khaali hai.";
        cartItemsBox.className = "empty";
      } else {
        cartItemsBox.className = "";
      }

      const deliveryCharge = subtotal === 0 ? 0 : (subtotal <= 100 ? 20 : 0);

      document.getElementById("subtotal").textContent = "₹" + subtotal;
      document.getElementById("delivery").textContent = "₹" + deliveryCharge;
      document.getElementById("grandTotal").textContent =
        "₹" + (subtotal + deliveryCharge);
    }

    function showVegetables() {
      productsBox.replaceChildren();

      vegetables.forEach((veg) => {
        const card = document.createElement("article");
        card.className = "product";

        const title = document.createElement("h3");
        title.textContent = veg.name;

        const price = document.createElement("div");
        price.className = "price";
        price.textContent = "₹" + veg.price + " / " + veg.unit;

        const stock = document.createElement("div");
        stock.className = "stock";
        stock.textContent = veg.stock > 0
          ? "Stock: " + veg.stock + " " + veg.unit
          : "Filhaal stock available nahi hai";

        if (veg.stock <= 0) stock.classList.add("unavailable");

        const quantityBox = document.createElement("div");
        quantityBox.className = "quantity";

        const minus = document.createElement("button");
        minus.textContent = "−";
        minus.disabled = veg.stock <= 0 || (cart[veg.id] || 0) <= 0;

        const number = document.createElement("span");
        number.textContent = cart[veg.id] || 0;

        const plus = document.createElement("button");
        plus.textContent = "+";
        plus.disabled = veg.stock <= 0 || (cart[veg.id] || 0) >= veg.stock;

        minus.addEventListener("click", () => {
          cart[veg.id] = Math.max(0, (cart[veg.id] || 0) - 1);
          showVegetables();
          updateCart();
        });

        plus.addEventListener("click", () => {
          if ((cart[veg.id] || 0) < veg.stock) {
            cart[veg.id] = (cart[veg.id] || 0) + 1;
            showVegetables();
            updateCart();
          }
        });

        quantityBox.append(minus, number, plus);
        card.append(title, price, stock, quantityBox);
        productsBox.appendChild(card);
      });
    }

    async function loadVegetables() {
      statusBox.textContent = "Sabziyon ki list load ho rahi hai...";
      productsBox.replaceChildren();

      try {
        const snapshot = await getDocs(collection(db, "vegetables"));
        vegetables.length = 0;

        snapshot.forEach((item) => {
          const data = item.data();
          vegetables.push({
            id: item.id,
            name: data.name || item.id,
            price: Number(data.price || 0),
            stock: Math.max(0, Number(data.stock || 0)),
            unit: data.unit || "Kg",
            available: data.available !== false
          });
        });

        vegetables.forEach((veg) => {
          if (!veg.available) veg.stock = 0;
        });

        showVegetables();
        updateCart();
        statusBox.textContent = snapshot.size + " sabziyan mil gayi hain.";
      } catch (error) {
        console.error(error);
        statusBox.textContent =
          "Sabziyan load nahi hui. Firebase Rules aur internet check karein.";
      }
    }

    document.getElementById("refresh").addEventListener("click", loadVegetables);
    loadVegetables();
  </script>
</body>
</html>

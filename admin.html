
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabji Hub Admin</title>
<style>
body{font-family:Arial;background:#f1f8f2;margin:0;padding:20px}
.box{max-width:400px;margin:60px auto;background:white;padding:25px;border-radius:15px;box-shadow:0 2px 12px #ccc}
h2{text-align:center;color:#16833b}
input,button{width:100%;padding:13px;margin-top:12px;box-sizing:border-box;border-radius:8px}
input{border:1px solid #bbb}
button{background:#16833b;color:white;border:0;font-size:16px}
#message{text-align:center;color:#c00}
</style>
</head>
<body>
<div class="box">
<h2>🥬 Sabji Hub Admin</h2>
<p>Admin account se login karein</p>
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">
<button id="login">Login</button>
<p id="message"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyAqF827n4_hn-b4-4pOLxgKqK39l7OMTt84",
authDomain: "sabji-hub.firebaseapp.com",
projectId: "sabji-hub",
storageBucket: "sabji-hub.firebasestorage.app",
messagingSenderId: "241093629232",
appId: "1:241093629232:web:c3a4defd6d01ab201024f5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

document.getElementById("login").addEventListener("click", async () => {
const email = document.getElementById("email").value.trim();
const password = document.getElementById("password").value;
const message = document.getElementById("message");

try {
const result = await signInWithEmailAndPassword(auth, email, password);
if (result.user.uid !== "GOi2IHhAM1NyaJoCPkY76wKA2JE2") {
await auth.signOut();
message.textContent = "Admin access nahi mila.";
return;
}
message.textContent = "Login successful!";
} catch (error) {
message.textContent = "Login nahi hua. Email aur password check karein.";
}
});
</script>
</body>
</html>
